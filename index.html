
<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <title>Fórmula Resolvente</title>
</head>

<body>

  <script>

    let continuar = true;

    while (continuar) {

      let a = Number(prompt("Valor de a:"));

      while (a === 0) {
        alert("O valor de a não pode ser zero.");
        a = Number(prompt("Valor de a:"));
      }

      let b = Number(prompt("Valor de b:"));

      let c = Number(prompt("Valor de c:"));

      let delta = b * b - 4 * a * c;

      if (delta >= 0) {

        let x1 = (-b + Math.sqrt(delta)) / (2 * a);

        let x2 = (-b - Math.sqrt(delta)) / (2 * a);

        alert("x1 = " + x1.toFixed(2) +
              " e x2 = " + x2.toFixed(2));

      } else {

        alert("Não existem raízes reais.");

      }

      continuar = confirm("Pretende realizar outro cálculo?");

    }

  </script>

</body>

</html>
